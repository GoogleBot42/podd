# podd — open firmware for the Eight Sleep Pod (workspace)
#
# Copyright (C) 2026 Jeremy Runyan and contributors
# Licensed under GPL-3.0-or-later (see ./LICENSE).
[workspace]
resolver = "2"
members = ["crates/pod-update", "crates/podup", "crates/podd"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/USER/podd"
authors = ["Jeremy Runyan <jeremy@runyan.org>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }

# Slightly smaller/faster release binaries for the on-device daemon.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
