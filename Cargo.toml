# podd — open firmware for the Eight Sleep Pod (workspace)
#
# Copyright (C) 2026 Jeremy Runyan and contributors
# Licensed under GPL-3.0-or-later (see ./LICENSE).
[workspace]
resolver = "2"
members = [
    "crates/pod-update",
    "crates/podup",
    "crates/pod-proto",
    "crates/podd-core",
    "crates/podd",
    "crates/pod-probe",
    "crates/api",
    "crates/pod-updater",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://git.neet.dev/zuckerberg/podd"
authors = ["Jeremy Runyan <jeremy@runyan.org>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }

# opensleep control-core dependencies (versions match upstream opensleep Cargo.toml).
# Used by the vendored `pod-proto` + `podd-core` crates.
tokio = { version = "1.45.1", features = ["full", "mio"] }
tokio-serial = "5.4.5"
tokio-util = { version = "0.7.15", features = ["codec"] }
linux-embedded-hal = "0.4.0"
embedded-hal = "1.0.0"
rustfft = "6.4.0"
cbor4ii = { version = "1.0.0", features = ["use_std", "serde1"] }
rumqttc = "0.24.0"
ron = "0.10.1"
jiff = { version = "0.2.15", features = ["serde", "tzdb-bundle-always"] }
log = "0.4.27"
env_logger = "0.11.8"
bytes = "1.10.1"
futures-util = { version = "0.3.31", features = ["sink"] }
memchr = "2.7.5"
strum = "0.27.2"
strum_macros = "0.27.2"
async-trait = "0.1.88"
hex-literal = "1.0.0"
csv = "1.3.1"

# device-side update agent (crates/pod-updater). rustls-only HTTP client so
# there is no OpenSSL/system-TLS dependency on the device; reuses the hyper 1.x
# stack already pulled in by axum.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# OS A/B slot writes: streaming decompress of os-<ver>.ext4.zst (frame checksum
# verified by the decoder) + posix_fadvise so readback-verify hits the medium.
zstd = "0.13"
libc = "0.2"

# web API (crates/api) — free-sleep-compatible HTTP + static SPA server.
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
tokio-stream = "0.1"

# Slightly smaller/faster release binaries for the on-device daemon.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
