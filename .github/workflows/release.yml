name: release

# Build + (optionally) sign the podd userland bundle and publish it to the
# GitHub Release for the tag, named exactly how pod-update-agent's GitHub source
# resolves it: releases/latest/download/manifest.json + app-<version>.squashfs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # Primary deliverable: the signed/unsigned userland bundle (flashing §6b item 1).
  userland-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build release bundle
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CHANNEL: stable
          # Optional signing secrets. If PODD_SIGNING_KEY is unset the manifest
          # is published UNSIGNED (artifact digests are still enforced).
          PODD_SIGNING_KEY: ${{ secrets.PODD_SIGNING_KEY }}
          PODD_SIGNING_PUB: ${{ secrets.PODD_SIGNING_PUB }}
        run: ./scripts/build-release.sh

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -eu
          # Create the release if it doesn't exist yet, else upload/overwrite.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes dist/* --verify-tag
          else
            gh release upload "$TAG" dist/* --clobber
          fi

  # NOTE: the OS-level artifacts — podd-sd.img.gz, podd-os.ext4.zst, the L2
  # podd-rootfs.tar.gz and podd-recovery-sd.img.gz (flashing §5 / §6b items 2-4,
  # #52) — are built by the `os-image` job in .gitea/workflows/release.yml, on
  # the self-hosted runner that carries the cached multi-hour Buildroot tree.
  # This mirror only publishes the userland bundle; there is no second copy of
  # that job here.
