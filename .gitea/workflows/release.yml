name: release

# Gitea Actions twin of .github/workflows/release.yml. Builds the SAME bundle
# via scripts/build-release.sh and publishes it to the Gitea Release for the
# tag, named so pod-updater's Gitea source resolves it:
#   <host>/<owner>/<repo>/releases/download/<tag>/manifest.json (+ app-<v>.squashfs)
#
# Runner note: targets the self-hosted NixOS runner (label: nixos) — a bare
# NixOS host with nix/git/curl in /run/current-system/sw/bin (see ci.yml).
# On a Docker-image runner (e.g. catthehacker/ubuntu) the Install Nix step
# takes over; on NixOS it no-ops because nix is already present.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: false
        default: ''

env:
  PATH: /run/current-system/sw/bin/
  XDG_CONFIG_HOME: ${{ runner.temp }}/.config

jobs:
  userland-bundle:
    runs-on: nixos
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v3

      # Gitea has no DeterminateSystems action available; install Nix with the
      # official Determinate installer script and put it on PATH. Skipped on
      # the NixOS runner, where nix is already in the system profile.
      - name: Install Nix
        run: |
          set -eu
          if command -v nix >/dev/null; then
            echo "nix already present: $(nix --version)"
            exit 0
          fi
          curl -fsSL https://install.determinate.systems/nix \
            | sh -s -- install linux --no-confirm --init none \
                --extra-conf "experimental-features = nix-command flakes"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Build release bundle
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CHANNEL: stable
          # Optional signing. Absent PODD_SIGNING_KEY => unsigned (digests still enforced).
          PODD_SIGNING_KEY: ${{ secrets.PODD_SIGNING_KEY }}
          PODD_SIGNING_PUB: ${{ secrets.PODD_SIGNING_PUB }}
        run: ./scripts/build-release.sh

      - name: Publish release assets
        env:
          # Gitea Actions provides GITHUB_* for compat; the token is auto-injected.
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          DIST_DIR: dist
        run: ./scripts/upload-release-gitea.sh

  # Recovery-SD / L2 artifacts - gated off until the L2 rootfs exists (§5, §6b).
  recovery-sd:
    if: ${{ false }}
    runs-on: nixos
    steps:
      - uses: actions/checkout@v3
      - name: Recovery-SD build plan (stub)
        run: ./scripts/build-recovery-sd.sh --plan
