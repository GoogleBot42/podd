name: release

# Gitea Actions twin of .github/workflows/release.yml. Builds the SAME bundle
# via scripts/build-release.sh and publishes it to the Gitea Release for the
# tag, named so pod-update-agent's Gitea source resolves it:
#   <host>/<owner>/<repo>/releases/download/<tag>/manifest.json (+ app-<v>.squashfs)
#
# Runner note: targets the self-hosted NixOS runner (label: nixos) — a bare
# NixOS host with nix/git/curl in /run/current-system/sw/bin (see ci.yml).
# On a Docker-image runner (e.g. catthehacker/ubuntu) the Install Nix step
# takes over; on NixOS it no-ops because nix is already present.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: false
        default: ''

env:
  PATH: /run/current-system/sw/bin/
  XDG_CONFIG_HOME: ${{ runner.temp }}/.config

jobs:
  userland-bundle:
    runs-on: nixos
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v3

      # Gitea has no DeterminateSystems action available; install Nix with the
      # official Determinate installer script and put it on PATH. Skipped on
      # the NixOS runner, where nix is already in the system profile.
      - name: Install Nix
        run: |
          set -eu
          if command -v nix >/dev/null; then
            echo "nix already present: $(nix --version)"
            exit 0
          fi
          curl -fsSL https://install.determinate.systems/nix \
            | sh -s -- install linux --no-confirm --init none \
                --extra-conf "experimental-features = nix-command flakes"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Build release bundle
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CHANNEL: stable
          # Optional signing. Absent PODD_SIGNING_KEY => unsigned (digests still enforced).
          PODD_SIGNING_KEY: ${{ secrets.PODD_SIGNING_KEY }}
          PODD_SIGNING_PUB: ${{ secrets.PODD_SIGNING_PUB }}
        run: ./scripts/build-release.sh

      - name: Publish release assets
        env:
          # Gitea Actions provides GITHUB_* for compat; the token is auto-injected.
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          DIST_DIR: dist
        run: ./scripts/upload-release-gitea.sh

  # OS OTA artifact: build the clean-room OS image (buildroot; slow — hours on
  # a cold runner, mostly cached after that) and re-publish the release with
  # the OS component added. Runs AFTER the fast app-only job so a release is
  # usable minutes after tagging; this job then re-runs build-release.sh with
  # OS_IMAGE set (the app bundle rebuild is a nix cache hit and reproducible)
  # and re-uploads dist/ — upload-release-gitea.sh replaces same-named assets,
  # so manifest.json atomically gains the Os component. If this job fails the
  # release simply stays app-only (still fully valid).
  os-image:
    runs-on: nixos
    needs: userland-bundle
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v3

      - name: Install Nix
        run: |
          set -eu
          if command -v nix >/dev/null; then
            echo "nix already present: $(nix --version)"
            exit 0
          fi
          curl -fsSL https://install.determinate.systems/nix \
            | sh -s -- install linux --no-confirm --init none \
                --extra-conf "experimental-features = nix-command flakes"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Build OS image (buildroot, FHS sandbox)
        run: |
          set -eu
          ./os/scripts/build.sh
          # Recovery SD = the image just built + the L2 rootfs tarball spliced
          # into its data partition (#52). Seconds, and it reuses the Buildroot
          # host mke2fs, so it belongs in this job rather than a second one.
          ./scripts/build-recovery-sd.sh
          # Stage the artifacts out of dist/ — build-release.sh recreates
          # dist/ from scratch (rm -rf) and would delete them.
          cp dist/podd-os.ext4.zst dist/podd-sd.img.gz \
             dist/podd-rootfs.tar.gz dist/podd-rootfs.tar.gz.sha256 \
             dist/podd-recovery-sd.img.gz "${RUNNER_TEMP}/"

      - name: Rebuild release bundle with OS component
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CHANNEL: stable
          PODD_SIGNING_KEY: ${{ secrets.PODD_SIGNING_KEY }}
          PODD_SIGNING_PUB: ${{ secrets.PODD_SIGNING_PUB }}
          OS_IMAGE: ${{ runner.temp }}/podd-os.ext4.zst
        run: ./scripts/build-release.sh

      - name: Publish release assets (incl. OS)
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
          DIST_DIR: dist
        run: ./scripts/upload-release-gitea.sh

      # Also attach the flashable SD images + the L2 rootfs tarball
      # (podd-slot-install.sh's payload — docs/RECOVERY.md).
      - name: Publish SD images + rootfs tarball
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -eu
          SD_DIR="$(mktemp -d)"
          cp "${RUNNER_TEMP}/podd-sd.img.gz" "$SD_DIR/podd-sd-${TAG}.img.gz"
          cp "${RUNNER_TEMP}/podd-recovery-sd.img.gz" \
             "$SD_DIR/podd-recovery-sd-${TAG}.img.gz"
          cp "${RUNNER_TEMP}/podd-rootfs.tar.gz" "$SD_DIR/podd-rootfs-${TAG}.tar.gz"
          cp "${RUNNER_TEMP}/podd-rootfs.tar.gz.sha256" \
             "$SD_DIR/podd-rootfs-${TAG}.tar.gz.sha256"
          DIST_DIR="$SD_DIR" ./scripts/upload-release-gitea.sh
