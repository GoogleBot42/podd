name: flake-update

# Weekly automated `nix flake update` (#21): bump flake inputs (nixpkgs — the
# Rust toolchain, cross toolchains, and every build dep come through it) so
# security fixes and updates arrive without anyone remembering to pull them.
#
# Shape: one long-lived branch (auto/flake-update), force-pushed each run, and
# one PR against main that the run opens if none is open (a second create
# attempt 409s — that's the "already open" signal, not an error). The per-PR
# CI lanes (cargo test + both nix builds) are the actual gate; this workflow
# deliberately does NOT auto-merge — a green PR still gets merged by a person
# or an agent session, so a toolchain bump never lands unseen.
#
# Same runner caveats as ci.yml: bare NixOS host, nothing on PATH beyond the
# system profile, everything project-specific through the flake. jq is not on
# PATH — JSON for the PR-create call is built with `nix run nixpkgs#jq`.

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

env:
  PATH: /run/current-system/sw/bin/
  XDG_CONFIG_HOME: ${{ runner.temp }}/.config

jobs:
  update:
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: nix flake update
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee flake-update.log
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already current — nothing to do"
          fi

      - name: Push branch + open PR (only if flake.lock changed)
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git diff --quiet -- flake.lock && exit 0
          git config user.name  "gitea-actions"
          git config user.email "actions@git.neet.dev"
          git checkout -B auto/flake-update
          git add flake.lock
          # The update log ("Updated input 'nixpkgs': ... -> ...") is the
          # whole story — put it in the commit body and the PR body.
          { echo "flake.lock: weekly automated input bump"
            echo
            cat flake-update.log
          } | git commit -F -
          git push -f origin auto/flake-update

          BODY="$(nix run nixpkgs#jq -- -Rs \
            '{title: "flake.lock: weekly automated input bump",
              head: "auto/flake-update", base: "main",
              body: ("Automated `nix flake update` (#21). CI is the gate; merge when green.\n\n```\n" + . + "```")}' \
            flake-update.log)"
          CODE="$(curl -s -o pr-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" "$API/repos/$REPO/pulls")"
          case "$CODE" in
            201) echo "opened PR: $(grep -o '"number":[0-9]*' pr-resp.json | head -n1)" ;;
            409) echo "PR already open — force-push refreshed it" ;;
            *)   echo "PR create failed (HTTP $CODE):"; cat pr-resp.json; exit 1 ;;
          esac
