[package]
name = "podd"
description = "Open control daemon for the Eight Sleep Pod (fork of opensleep)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "podd"
path = "src/main.rs"

[dependencies]
podd-core = { path = "../podd-core" }
api = { path = "../api" }
pod-updater = { path = "../pod-updater" }

anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
tokio.workspace = true

# NOTE: the schedule layer (thermostat scheduler) lands here as the fork grows.
# The on-device update agent is wired below via `pod_updater::run_from_env`.
