# Journal sizing + per-service rate limit (fallout of the 2026-09-23 outage).
#
# podd's MQTT reconnect backoff overflowed to 0 ns after ~1 h offline and the
# daemon logged ~800 identical error lines per second: 36 MB of journal in
# five minutes, which rotated every older log out of the 48 MB default cap
# and left no evidence of what had taken the Pod offline in the first place
# (podd PR #191 fixed the bug). These settings make sure the next flood, from
# whatever source, cannot erase the history around it or fill the root fs.
#
# RateLimitBurst=1000 / RateLimitIntervalSec=30s: a single service may log
# 1000 messages per 30 s (~33/s sustained) before journald drops the excess
# and logs one "Suppressed N messages" line. Normal traffic is far below that:
# podd writes ~1500 lines per WEEK; the busiest boot burst (kernel + NM) is a
# few hundred lines and is per-service anyway. The default was 10000/30 s.
#
# SystemMaxUse=48M: the same ceiling the 10 % default resolves to on the
# ~490 MB root slot, pinned so a bigger slot never grows the journal on a
# card that also holds /data (230 MB). SystemKeepFree=64M protects the root
# fs. SystemMaxFileSize=4M gives finer rotation so a burst evicts hours, not
# days, of older entries.
#
# Storage=persistent restates the existing behaviour (/var/log/journal is
# created by the image) so it is visible here rather than implied.
[Journal]
Storage=persistent
SystemMaxUse=48M
SystemKeepFree=64M
SystemMaxFileSize=4M
RateLimitIntervalSec=30s
RateLimitBurst=1000
