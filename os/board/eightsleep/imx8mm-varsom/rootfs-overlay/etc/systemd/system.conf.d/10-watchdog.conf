# Hardware watchdog: let PID 1 kick the SoC watchdog (issue #172).
#
# The i.MX8MM watchdog (imx2-wdt @ 0x30280000, CONFIG_IMX2_WDT=y, /dev/watchdog)
# is present and probed on every boot, but until this drop-in nothing opened it.
# systemd's Restart=always covers a podd crash; it does nothing for a kernel or
# PID-1 hang, which used to ride out — heaters still holding their last setpoint
# — until someone physically power-cycled the Pod.
#
# RuntimeWatchdogSec=30s: PID 1 opens /dev/watchdog, programs the hardware
# timeout to 30 s and pings it every 15 s (systemd always kicks at half the
# configured interval). Both numbers sit well under the driver's limits — the
# imx2-wdt default timeout is 60 s and its hardware ceiling
# (IMX2_WDT_MAX_TIME / max_hw_heartbeat_ms) is 128 s — so the requested timeout
# is programmed verbatim, not silently clamped.
#
# RebootWatchdogSec=10min is systemd's own default, restated so the shutdown-path
# behaviour is visible next to the runtime one: during a reboot the watchdog stays
# armed at 10 min, so a shutdown that wedges also gets reset out of it.
#
# Deliberately NOT set here:
#   RuntimeWatchdogPreSec  — CONFIG_WATCHDOG_PRETIMEOUT_GOV is off in
#                            linux-podd.config, so a pretimeout has nothing to
#                            dispatch to.
#   WatchdogDevice         — /dev/watchdog (the default) is the imx2-wdt; this
#                            board has no second watchdog to disambiguate from.
#
# Daemon-level supervision (WatchdogSec= + sd_notify on podd.service) is a
# separate decision and deliberately not part of this layer: a spurious podd
# restart drops the sensor MCU into its ~60 s zombie window. See
# docs/CLEANROOM-OS.md ("Hardware watchdog").
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
