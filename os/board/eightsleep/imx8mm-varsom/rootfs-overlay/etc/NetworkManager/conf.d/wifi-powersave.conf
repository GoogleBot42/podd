# WiFi power saving off. Unset, NetworkManager enables it, and the hub's
# BCM4339 (brcmfmac, 2019 firmware) is notorious for staying associated at
# full signal while dropping traffic under power save. On 2026-10-11 the Pod
# lost its MQTT broker ~100 times an hour ("Host is unreachable") for most of
# a day with no disassociation logged. A bed that is always plugged in has
# no use for the savings.
[connection]
wifi.powersave = 2
