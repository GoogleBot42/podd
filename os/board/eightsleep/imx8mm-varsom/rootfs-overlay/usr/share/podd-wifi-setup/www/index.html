<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podd WiFi setup</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 3rem auto;
         padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { width: 100%; padding: .6rem; margin-top: .3rem; font-size: 1rem;
          border: 1px solid #aaa; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 1.5rem; width: 100%; padding: .7rem; font-size: 1rem;
           border: 0; border-radius: 6px; background: #1a6ee0; color: #fff; }
  p { color: #555; }
</style>
</head>
<body>
<h1>Connect your pod to WiFi</h1>
<p>Enter your home WiFi network's name and password. The pod will join it and
this setup network will disappear.</p>
<form method="post" action="/cgi-bin/setup">
  <label for="ssid">Network name (SSID)</label>
  <input id="ssid" name="ssid" required autocapitalize="off" autocorrect="off">
  <label for="psk">Password</label>
  <input id="psk" name="psk" type="password"
         placeholder="leave empty for an open network">
  <button type="submit">Connect</button>
</form>
</body>
</html>
