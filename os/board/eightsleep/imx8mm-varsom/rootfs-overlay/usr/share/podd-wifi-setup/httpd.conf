# busybox httpd config for the podd WiFi setup portal.
# Captive-portal helper: phones probe arbitrary URLs (/generate_204,
# /hotspot-detect.html, ...) to detect connectivity; combined with the
# wildcard DNS in dnsmasq-shared.d, answering every unknown path with the
# setup form makes the phone raise its "sign in to network" screen.
# NB: busybox opens error pages relative to the httpd home dir (it chdirs
# there) — a leading slash would make this an absolute filesystem path.
E404:index.html
