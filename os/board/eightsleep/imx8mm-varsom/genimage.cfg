# genimage layout for the podd clean-room SD image.
#
#   0x8400   (raw)  imx-boot         (SPL + ATF + U-Boot + NXP DDR/HDMI blobs)
#   0x400000 (raw)  U-Boot env       (RAUC BOOT_ORDER; written by post-image.sh)
#   p1              rootfs A (ext4, includes /boot: Image.gz + podd.dtb)
#   p2              rootfs B (ext4, identical size to A)
#   p3              persistent data  (config, schedules, logs, rauc state)
#
# imx-boot must land at 0x8400 and NOT collide with the env at 0x400000 or the
# first partition. The MBR/partition table sits at sector 0; the first partition
# therefore starts at 8 MiB to clear both raw regions.

# The `imx-boot` boot container and `uboot-env.bin` are flat files staged into
# BINARIES_DIR by post-image.sh; genimage references them by name from the
# inputpath (no `image {}` block needed, same as a prebuilt blob).

image rootfs_a.ext4 {
	ext4 { label = "rootfs_a" }
	mountpoint = "/"
	size = 512M
}

image rootfs_b.ext4 {
	ext4 { label = "rootfs_b" }
	# Slot B is provisioned empty at first flash; RAUC populates it on the first
	# update. Kept the same size as A.
	size = 512M
}

image data.ext4 {
	ext4 { label = "podd_data" }
	size = 256M
}

image podd-sd.img {
	hdimage {
		# DOS table; matches the stock SD's addressing so U-Boot's mmc numbering
		# is unchanged (SD = mmcblk1 / mmcdev=1).
		partition-table-type = "mbr"
	}

	# Raw boot blob at 0x8400. genimage writes it at the given offset.
	partition imx-boot {
		in-partition-table = "no"
		image = "imx-boot"
		offset = 0x8400
	}

	# U-Boot env at 0x400000 (written separately by post-image.sh via mkenvimage;
	# reserved here so no partition overlaps it).
	partition uboot-env {
		in-partition-table = "no"
		image = "uboot-env.bin"
		offset = 0x400000
		size = 0x1000
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs_a.ext4"
		offset = 8M
	}

	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs_b.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
