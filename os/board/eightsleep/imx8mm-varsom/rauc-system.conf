# RAUC system configuration for the podd clean-room image.
#
# Two symmetric rootfs slots (A/B) plus a persistent data partition that RAUC
# never touches. Slot selection is driven by U-Boot's boot-count logic (see
# uboot-env.txt): BOOT_ORDER + BOOT_<slot>_LEFT, with auto-rollback when a slot
# fails to mark itself good.
#
# NOTE: the compatible string is checked against every bundle — a bundle built
# for a different board is refused. Keep it stable across releases.

[system]
compatible=podd-imx8mm-varsom
bootloader=uboot
# Partition holding mutable state; excluded from updates.
data-directory=/data/rauc

# Bundle verification. Point this at the public half of the offline release key.
# The private key stays off-device (see docs/RELEASING.md). Ship the cert in the
# rootfs so every slot can verify the next bundle.
[keyring]
path=/etc/rauc/keyring.pem

# --- slots -------------------------------------------------------------------
# bootname is the token U-Boot's BOOT_ORDER uses to select the slot.

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B
